buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.1.20'
  }
}

plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
}

apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def isDevelopment = System.getenv('APP_VARIANT') == 'development'
def fallbackApplicationId = isDevelopment ? 'sh.paseo.debug' : 'sh.paseo'
def paseoApplicationId = project.findProperty('paseoWearApplicationId') ?: fallbackApplicationId

android {
  namespace paseoApplicationId
  compileSdk 36

  defaultConfig {
    applicationId paseoApplicationId
    minSdk 29
    targetSdk 36
    versionCode 5000
    versionName '0.5.0'
  }

  signingConfigs {
    debug {
      storeFile new File(rootProject.projectDir, 'app/debug.keystore')
      storePassword 'android'
      keyAlias 'androiddebugkey'
      keyPassword 'android'
    }
  }

  buildTypes {
    debug {
      signingConfig signingConfigs.debug
    }
    // Paseo's local release profile uses this same development signing key.
    release {
      signingConfig signingConfigs.debug
    }
  }

  buildFeatures {
    compose true
    buildConfig true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }
}

dependencies {
  implementation 'androidx.activity:activity-compose:1.9.3'
  implementation platform('androidx.compose:compose-bom:2024.10.01')
  implementation 'androidx.compose.ui:ui'
  implementation 'androidx.compose.ui:ui-tooling-preview'
  implementation 'androidx.compose.foundation:foundation'
  implementation 'androidx.compose.material3:material3:1.3.1'
  implementation 'androidx.compose.material:material'
  implementation 'androidx.wear.compose:compose-material:1.4.0'
  implementation 'androidx.wear.compose:compose-foundation:1.4.0'
  implementation 'androidx.wear:wear:1.3.0'
  implementation 'com.google.android.gms:play-services-wearable:19.0.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1'
  debugImplementation 'androidx.compose.ui:ui-tooling'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20240303'
}
